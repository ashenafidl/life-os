services:
  lifeos-app:
    container_name: lifeos-app
    image: ashenafidl/lifeos:latest
    restart: always

    # network_mode: host is required for mDNS / Bonjour discovery to broadcast on host local network (LAN).
    network_mode: "host"

    depends_on:
      lifeos-postgres:
        condition: service_healthy

    environment:
      - PORT=3131
      - DATABASE_URL=postgresql://lifeos:lifeos@127.0.0.1:5433/lifeos?schema=public

  lifeos-postgres:
    container_name: lifeos-postgres
    image: postgres:latest
    restart: always

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s

    volumes:
      - lifeos_postgres_data:/var/lib/postgresql

    environment:
      - POSTGRES_DB=lifeos
      - POSTGRES_USER=lifeos
      - POSTGRES_PASSWORD=lifeos

volumes:
  lifeos_postgres_data:
